    <style>#boot-note{color:#141414;z-index:9999;background:#fff;border:1px solid #ffb9d3;max-width:620px;padding:22px 26px;font:13px/1.9 Noto Sans TC,Microsoft JhengHei,sans-serif;position:fixed;top:42%;left:50%;transform:translate(-50%,-50%);box-shadow:0 12px 40px #00000014}#boot-note b{color:#c9285f;margin-bottom:8px;font-size:15px;display:block}#boot-note code{word-break:break-all;background:#fff0f5;padding:1px 4px;font-family:Consolas,monospace;font-size:11px}</style>
    <!--
      開場自檢：如果 3 秒後畫面還是空的，直接說出原因，
      不要讓使用者只看到白屏。
    -->
    <script>
      ;(function () {
        var imgFails = 0
        var imgNoteShown = false

        function note(html) {
          var el = document.getElementById('boot-note')
          if (!el) return
          el.innerHTML = html
          el.hidden = false
        }

        function imageNote() {
          if (imgNoteShown) return
          imgNoteShown = true
          note(
            '<b>找不到圖片（' +
              imgFails +
              ' 張）</b>程式跑起來了，但 <code>img/</code> 或 <code>panel/</code> 資料夾不在 index.html 旁邊。<br>' +
              '最常見的原因：直接在壓縮包裡點開 index.html。請對 zip 按右鍵 →「全部解壓縮」，再開資料夾裡的 index.html。<br>' +
              '如果已經解壓縮還是這樣，改用同一個資料夾的 <code>如果打不開_用這個.cmd</code>。',
          )
        }

        window.addEventListener(
          'error',
          function (e) {
            var t = e.target

            // 圖片 404 不是程式錯誤，不要誤報
            if (t && t.tagName === 'IMG') {
              imgFails++
              if (imgFails >= 4) imageNote()
              return
            }

            if (t && t.tagName === 'SCRIPT') {
              note(
                '<b>程式檔沒有載入</b>找不到 <code>' +
                  (t.src || 'assets/app.js') +
                  '</code>。<br>如果你是按兩下壓縮包裡的 index.html，系統只解出了那一個檔案——請先「解壓縮」，再開資料夾裡的 index.html。',
              )
              return
            }

            if (e.message) {
              note('<b>執行時發生錯誤</b><code>' + e.message + '</code>')
            }
          },
          true,
        )

        window.addEventListener('unhandledrejection', function (e) {
          var msg = (e.reason && e.reason.message) || e.reason || ''
          note('<b>執行時發生錯誤</b><code>' + msg + '</code>')
        })

        var ticks = 0
        var timer = setInterval(function () {
          var root = document.getElementById('root')
          if (root && root.children.length) {
            clearInterval(timer)
            var el = document.getElementById('boot-note')
            // 程式有跑起來就不要蓋住畫面；圖片缺失的提示另外處理
            if (el && !imgNoteShown) el.hidden = true
            return
          }
          ticks++
          if (ticks >= 6) {
            clearInterval(timer)
            note(
              '<b>3 秒過去，畫面仍然是空的</b>最常見的原因是：直接在壓縮包裡點開 index.html，檔案沒有解壓。<br>請對 zip 按右鍵 →「全部解壓縮」，再開資料夾裡的 index.html。<br>或改用同一個資料夾的 <code>如果打不開_用這個.cmd</code>。',
            )
          }
        }, 500)
      })()
    </script>
